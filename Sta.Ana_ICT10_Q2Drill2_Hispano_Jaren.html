<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Club Member Manager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2024.1.1/core.css"
    >
    <script
        type="module"
        src="https://pyscript.net/releases/2024.1.1/core.js"
    ></script>

    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #0000ff, #001aff);
            min-height: 100vh;
        }

        .main-card {
            max-width: 800px;
            margin: 50px auto;
            border-radius: 20px;
        }

        .header {
            background: #ef0b0b;
            color: rgb(0, 0, 0);
            border-radius: 20px 20px 0 0;
            padding: 25px;
        }

        .member-list {
            background: #007efd;
            border-radius: 12px;
            padding: 20px;
        }

        #results {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow main-card">

            <!-- Page Header -->
            <div class="header text-center">
                <h1>ᑢᗩᘻᕵᑘS ᑢᒪᑘᗷ ᘻᘿᘻᗷᘿᖇ ᘻᗩᘉᗩᘜᘿᖇ</h1>
                <p class="mb-0">S͓̽t͓̽u͓̽d͓̽e͓̽n͓̽t͓̽ ͓̽C͓̽l͓̽u͓̽b͓̽ ͓̽R͓̽e͓̽g͓̽i͓̽s͓̽t͓̽r͓̽a͓̽t͓̽i͓̽o͓̽n͓̽ ͓̽S͓̽y͓̽s͓̽t͓̽e͓̽m͓̽</p>
            </div>

            <div class="card-body p-4">

                <!-- Member Input Form -->
                <h3 class="mb-3">Add New Member</h3>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="first_name" class="form-label">
                            𝕱𝖎𝖗𝖘𝖙 𝖓𝖆𝖒𝖊
                        </label>

                        <input
                            type="text"
                            id="first_name"
                            class="form-control"
                            placeholder="Enter first name"
                        >
                    </div>

                    <div class="col-md-6">
                        <label for="last_name" class="form-label">
                            𝕷𝖆𝖘𝖙 𝖓𝖆𝖒𝖊
                        </label>

                        <input
                            type="text"
                            id="last_name"
                            class="form-control"
                            placeholder="Enter last name"
                        >
                    </div>

                </div>

                <!-- Button with PyScript event -->
                <div class="d-grid mt-4">
                    <button
                        class="btn btn-primary btn-lg"
                        py-click="add_member"
                    >
                        Add Member
                    </button>
                </div>

                <!-- Results -->
                <div id="results" class="member-list">
                    <h3>Club Members</h3>
                    <p>Members will appear here.</p>
                </div>

            </div>
        </div>
    </div>


    <!-- PyScript Code -->
    <script type="py">

# Predefined sets of student club members
grade7 = {
    "Liam Cruz",
    "Mia Santos",
    "Noah Garcia"
}

grade8 = {
    "Emma Reyes",
    "Lucas Dela Cruz",
    "Sofia Tan"
}

grade9 = {
    "Ethan Ramos",
    "Olivia Flores",
    "Daniel Lim"
}

grade10 = {
    "Ava Mendoza",
    "Gabriel Torres",
    "Chloe Navarro"
}


# Master set combines all grade-level sets
master_set = grade7 | grade8 | grade9 | grade10


def add_member(event):

    # Get the first and last names from the text boxes
    first_name = document.getElementById("first_name").value.strip()
    last_name = document.getElementById("last_name").value.strip()

    # Create the complete name
    new_member = f"{first_name} {last_name}"

    # Add the new member using a set union operator
    master_set.update({new_member})

    # Sort the set only for cleaner display
    members = sorted(master_set)

    # Display the members and total using an f-string
    display(
        f"""
        <h3>Club Members</h3>

        <ol>
            {"".join(f"<li>{member}</li>" for member in members)}
        </ol>

        <hr>

        <h4>Total Members: {len(master_set)}</h4>
        """,
        target="results",
        append=False
    )

</script>

</body>
</html>
```
